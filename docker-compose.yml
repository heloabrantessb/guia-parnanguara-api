version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: guia_parnanguara_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guia_parnanguara_db}
      POSTGRES_USER: ${POSTGRES_USER:-guia_parnanguara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guia_parnanguara_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guia_parnanguara_user} -d ${POSTGRES_DB:-guia_parnanguara_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
